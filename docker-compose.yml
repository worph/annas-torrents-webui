services:
  annas-torrents-webui:
    build: .
    container_name: annas-torrents-webui
    ports:
      - "${WEB_PORT:-8080}:8080"
      # Only needed for TORRENT_BACKEND=libtorrent (embedded peer traffic)
      - "6881:6881/tcp"
      - "6881:6881/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATA_DIR=/data
      - TORRENT_PORT=6881
      # libtorrent (default) | qbittorrent
      - TORRENT_BACKEND=${TORRENT_BACKEND:-libtorrent}
      # Used when TORRENT_BACKEND=qbittorrent
      - QBIT_URL=${QBIT_URL:-http://host.docker.internal:8080}
      - QBIT_USER=${QBIT_USER:-admin}
      - QBIT_PASS=${QBIT_PASS:-}
      - QBIT_CATEGORY=${QBIT_CATEGORY:-Anna's Archive}
      - QBIT_SAVE_PATH=${QBIT_SAVE_PATH:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
